[project]
name = "synthio-backend"
version = "0.1.0"
description = "FastAPI + LiveKit Agents backend for the Synthio voice slide presenter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "livekit-api>=1.0",
    "livekit-agents~=1.8.8",
    "python-dotenv>=1.0",
]

[project.scripts]
synthio-api = "synthio_backend.api.main:run"
synthio-agent = "synthio_backend.agent.worker:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthio_backend"]

[tool.uv]
# yarl 1.24.1 shipped only a cp310 wheel (see agent-starter-python).
constraint-dependencies = ["yarl<1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["synthio_backend"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["livekit.*"]
follow_untyped_imports = true
